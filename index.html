<!--==== CSS ====-->
<style>
    .ic-main-wrapper {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 850px;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .ic-title {
        font-size: 2.2rem;
        font-weight: 700;
        color: #0f172a;
        text-align: center;
        margin-bottom: 30px;
    }

    .ic-dropzone-area {
        border: 1.5px dashed #cbd5e1;
        border-radius: 12px;
        padding: 60px 20px;
        text-align: center;
        background-color: #f8fafc;
        transition: all 0.3s ease;
    }

    /* Active Drag State*/
    .ic-dropzone-area.dragover {
        border-color: #1A73E8;
        background-color: #f1f5f9
    }

    .ic-icon-box {
        width: 64px;
        height: 64px;
        background-color: #e8f0fe;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        color: #1A73E8
    }

    .ic-icon-box svg {
        width: 28px;
        height: 28px;
        fill: currentColor;
    }

    .ic-primary-text {
        font-size: 1.15rem;
        color: #0f172a;
        font-weight: 500;
        margin-bottom: 12px;
    }

    .ic-browse-link {
        color: #1A73E8;
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
    }

    .ic-browse-link:hover {
        text-decoration: underline;
    }

    .ic-secondary-text {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 24px;
    }

    .ic-format-tags {
        display: flex;
        flex-wrap:wrap;
        gap: 12px;
        justify-content: center;
    }

    .ic-format-tags span {
        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #64748b;
        font-size: 0.8rem;
        padding: 6px 18px;
        border-radius: 20px;
    }

    .ic-action-panel {
        margin-top: 25px;
        display: none;
        text-align: center;
        background: #f8fafc;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
    }

    .ic-btn-primary {
        background: #1A73E8;
        color: #ffffff;
        border: none;
        padding: 12px 28px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s;
    }

    .ic-btn-primary:hover {
        background: #1557b0;
    }

    .ic-btn-primary:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    .ic-stasus-msg {
        margin-bottom: 15px;
        font-size: 0.95rem;
        color: #334155;
        font-weight: 500;
    }
</style>
<!--==== HTML ====-->
<!-- JSZip Library for Bulk Downloading -->
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

 <div class="ic-main-wrapper">
    <div class="ic-title">Image Compressor</div>

    <!-- The Drag and Drop Zone-->
    <div class="ic-dropzone-area" id="icDropzone">
        <input type="file" id="icFileInput" multiple accept="image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff, image/avif" style="display: none;">

        <div class="ic-icon-box">
            <svg viewBox = "0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h14l-4-5z"/>
            </svg>
        </div>

        <div class="ic-primary-text">
            Drop image here or <span class="ic-browse-link" id="icBrowseBtn">click to browse</span>
        </div>
        <div class="ic-secondary-text">
            Multiple image supported - bulk compress & download as ZIP
        </div>

        <div class="ic-format-tags">
            <span>JPEG</span><span>PNG</span><span>WebP</span><span>GIF</span><span>BMP</span><span>TIFF</span><span>AVIF</span>
        </div>
    </div>

    <!-- Action Panel (Hidden by default) -->
     <div class="ic-action-panel" id="icActionPanel">
        <div id="icStatusText" class="ic-status-msg">0 images selected</div>
        <button class="ic-btn-primary" id="icCompressBtn">Compress & Download ZIP</button>
     </div>
 </div>

 <!--==== JavaScript ====-->
